[project]
name = "discoop"
version = "1.0.0"
description = "Download messages and files from Discord servers you are a member of."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "platformdirs>=4.14.3",
    "rich>=15.0.0",
    "segno>=1.6.6",
    "textual>=8.2.8",
    "typer>=0.27.3",
    "websockets>=17.4",
]

[project.scripts]
discoop = "discoop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discoop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
